" lengthAdjust="spacing" textLength="46.5762" x="1487.6045" y="214.6621">(Kitchen)</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="161" id="ent0070"><path d="M1714.5,1012.252 L1714.5,1096.0566 A3,3 0 0 0 1717.5,1099.0566 L1949.7598,1099.0566 A3,3 0 0 0 1952.7598,1096.0566 L1952.7598,1019.252 L1942.7598,1009.252 L1717.5,1009.252 A3,3 0 0 0 1714.5,1012.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1942.7598,1009.252 L1942.7598,1017.752 A1.5,1.5 0 0 0 1944.2598,1019.252 L1952.7598,1019.252 L1942.7598,1009.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="196.1309" x="1720.5" y="1027.2012">End-of-day reconciliation aggregates</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="209.3086" x="1720.5" y="1043.1621">cash (UC-10), online payments, refunds,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="208.9336" x="1720.5" y="1059.123">Comp, Forfeited, and Write-off buckets,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="217.2598" x="1720.5" y="1075.084">and hands over unresolved exceptions to</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="71.5605" x="1720.5" y="1091.0449">the next shift.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="169" id="ent0073"><path d="M1710,63.252 L1710,131.0957 A3,3 0 0 0 1713,134.0957 L1953.6621,134.0957 A3,3 0 0 0 1956.6621,131.0957 L1956.6621,70.252 L1946.6621,60.252 L1713,60.252 A3,3 0 0 0 1710,63.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1946.6621,60.252 L1946.6621,68.752 A1.5,1.5 0 0 0 1948.1621,70.252 L1956.6621,70.252 L1946.6621,60.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="217.1367" x="1716" y="78.2012">86'd is independent from inventory stock</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="217.2773" x="1716" y="94.1621">adjustment (&#167;3m). Paid orders containing</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="225.6621" x="1716" y="110.123">a now-86'd item are flagged and escalated</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="217.1191" x="1716" y="126.084">to Handle Complaint for Manager action.</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="176" id="ent0076"><path d="M1714.5,916.252 L1714.5,984.0957 A3,3 0 0 0 1717.5,987.0957 L1949.0391,987.0957 A3,3 0 0 0 1952.0391,984.0957 L1952.0391,923.252 L1942.0391,913.252 L1717.5,913.252 A3,3 0 0 0 1714.5,916.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1942.0391,913.252 L1942.0391,921.752 A1.5,1.5 0 0 0 1943.5391,923.252 L1952.0391,923.252 L1942.0391,913.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="216.2871" x="1720.5" y="931.2012">Resolutions include remake, substitution,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="186.6738" x="1720.5" y="947.1621">partial refund, full refund, Comp, or</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="191.0332" x="1720.5" y="963.123">Write-off; refund / Comp / Write-off</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="216.5391" x="1720.5" y="979.084">require Manager approval with audit log.</text></g><!--link Cashier to FOHStaff--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-t