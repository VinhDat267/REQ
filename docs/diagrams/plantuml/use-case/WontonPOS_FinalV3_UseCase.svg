="1783.2012">Guest checkout remains allowed</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="179.7598" x="313.5" y="1799.1621">without this use case. Registration</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="170.4727" x="313.5" y="1815.123">is optional; login unlocks UC-04,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="75.3105" x="313.5" y="1831.084">UC-15, UC-17.</text></g><g class="entity" data-qualified-name="GMN109" data-source-line="218" id="ent0110"><path d="M863.5,63.252 L863.5,163.0176 A3,3 0 0 0 866.5,166.0176 L1055.9805,166.0176 A3,3 0 0 0 1058.9805,163.0176 L1058.9805,70.252 L1048.9805,60.252 L866.5,60.252 A3,3 0 0 0 863.5,63.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1048.9805,60.252 L1048.9805,68.752 A1.5,1.5 0 0 0 1050.4805,70.252 L1058.9805,70.252 L1048.9805,60.252" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="174.4805" x="869.5" y="78.2012">Checkout captures service model</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="157.5293" x="869.5" y="94.1621">(Dine-in / Takeaway / Pickup),</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="163.0664" x="869.5" y="110.123">applies an optional promotion,</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="158.4551" x="869.5" y="126.084">and routes to Online Payment</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="172.3184" x="869.5" y="142.0449">for Takeaway / Pickup or directly</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="139.4941" x="869.5" y="158.0059">t